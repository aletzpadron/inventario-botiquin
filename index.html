<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--accent:#1769aa;--green:#1f9d55;--red:#d64545;--yellow:#d99a00;--shadow:0 6px 22px rgba(20,35,55,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.wrap{max-width:1200px;margin:auto;padding:14px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:14px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}
.field input,.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.stats{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}
.circle-wrap{display:flex;justify-content:center}.circle{width:155px;height:155px;border-radius:50%;background:conic-gradient(var(--green) 0deg,#e8edf3 0deg);display:grid;place-items:center;position:relative}
.circle:before{content:"";position:absolute;width:120px;height:120px;background:#fff;border-radius:50%}.circle>div{position:relative;text-align:center}.pct{font-size:36px;font-weight:850}.circle-label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}.g{background:var(--green)}.r{background:var(--red)}
.alerts{margin-top:10px}.alert{padding:10px 12px;border-radius:10px;margin-top:7px;font-size:13px;font-weight:700}.alert.warn{background:#fff3cd;color:#805b00}.alert.danger{background:#ffe0e0;color:#a32626}.alert.info{background:#e8eef5;color:#536273}
.tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px;position:sticky;top:0;background:var(--card);padding-bottom:4px;z-index:3}
.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#667085}
.category{border:1px solid var(--line);border-radius:15px;margin:10px 0;overflow:hidden;background:#fff}
.category-head{width:100%;border:0;background:#eef3f8;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;text-align:left;font-weight:850;color:var(--text);cursor:pointer}
.category-head small{color:var(--muted);font-weight:700}.chev{transition:.2s}.category.closed .chev{transform:rotate(-90deg)}
.category-body{padding:0}.category.closed .category-body{display:none}
.item{padding:14px;border-top:1px solid var(--line)}
.item-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.item-name{font-weight:800;line-height:1.3}.item-no{color:var(--muted);font-size:12px;min-width:30px}
.badge{font-size:11px;font-weight:900;border-radius:999px;padding:6px 9px;white-space:nowrap}.ok{background:#dff4e7;color:#146b39}.bad{background:#ffe0e0;color:#a32626}
.item-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:7px 0}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.qty-btn{width:44px;height:44px;border:0;border-radius:12px;background:#eef3f8;color:var(--text);font-size:24px;font-weight:800;cursor:pointer}.qty-input{width:100%;height:44px;text-align:center;border:1px solid var(--line);border-radius:12px;font-size:18px;font-weight:800}.expiry-row{margin-top:9px}.expiry-row label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.expiry{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.empty{padding:25px;text-align:center;color:var(--muted)}
@media(min-width:800px){.wrap{padding:22px}.card{padding:20px}.item{padding:14px}.category-body{display:grid;grid-template-columns:1fr 1fr}.category-body .item{border-right:1px solid var(--line)}}
@media(max-width:700px){.wrap{padding:10px}.head{align-items:flex-start}.head .btn{padding:10px 11px}.meta{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.circle{width:140px;height:140px}.circle:before{width:108px;height:108px}.tools{grid-template-columns:1fr}.tools .btn{width:100%}.legend{font-size:12px}.card{border-radius:15px}}
@media print{body{background:#fff}.card{box-shadow:none}.tools,.btn,.qty-btn{display:none!important}.category.closed .category-body{display:block}.category-body{display:block}.item{break-inside:avoid}.search{display:none}}
</style>

     el.querySelector(".minus").onclick=()=>update(Math.max(0,(Number(x.qty)||0)-1));
     el.querySelector(".plus").onclick=()=>update((Number(x.qty)||0)+1);
     input.oninput=e=>{x.qty=e.target.value===""?"":Math.max(0,parseInt(e.target.value,10)||0);save();renderStats();const badge=el.querySelector(".badge");const [ns,nc]=status(x);badge.textContent=ns;badge.className="badge "+nc};
     const ex=el.querySelector(".expiry");if(ex)ex.onchange=e=>{x.expiry=e.target.value;save();renderStats()};
     body.appendChild(el);
   });
   section.querySelector(".category-head").onclick=()=>section.classList.toggle("closed");
   box.appendChild(section);
 });
 renderStats();
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function renderStats(){
 const total=state.items.length, complete=state.items.filter(x=>x.qty!==""&&Number(x.qty)>=x.min).length;
 const p=Math.round(complete/total*100);$("pct").textContent=p+"%";
 $("circle").style.background=`conic-gradient(var(--green) ${p*3.6}deg,#e8edf3 ${p*3.6}deg)`;
 const now=new Date();now.setHours(0,0,0,0);const alerts=[];
 state.items.forEach(x=>{if(!x.expiryRequired||!x.expiry)return;const d=new Date(x.expiry+"T00:00:00"),days=Math.ceil((d-now)/86400000);if(days<0)alerts.push('<div class="alert danger">⚠️ Caducado: '+escapeHTML(x.name)+' — '+x.expiry+'</div>');else if(days<=30)alerts.push('<div class="alert warn">⚠️ Caduca en '+days+' día'+(days===1?"":"s")+': '+escapeHTML(x.name)+' — '+x.expiry+'</div>')});
 $("expiryAlerts").innerHTML=alerts.length?alerts.join(""):'<div class="alert info">✓ Sin alertas de caducidad en los próximos 30 días.</div>';
}
["botiquin","fecha","responsable","observaciones"].forEach(id=>$(id).addEventListener("input",e=>{state.meta[id]=e.target.value;save()}));
$("search").addEventListener("input",render);
$("clear").addEventListener("click",()=>{if(confirm("¿Limpiar todas las existencias y caducidades?")){state.items.forEach(x=>{x.qty="";x.expiry=""});save();render()}});
$("print").addEventListener("click",()=>window.print());
load();render();
const c=window.INVENTARIO_CONFIG||{};if(!c.SHARED_MODE){const n=$("sharedModeNotice");if(n)n.style.display="block";}
</script>
</body>
</html>
